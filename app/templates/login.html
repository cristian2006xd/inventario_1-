{% extends "base.html" %}
{% block titulo %}Iniciar Sesión | INAMHI{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-cloud-sun-fill" style="font-size: 3rem; color: #2c3e50;"></i>
            <h4 class="mt-2 mb-0" style="color: #2c3e50;">INAMHI</h4>
            <div class="text-muted">Control de Activos</div>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                        <i class="bi bi-eye" id="icono-toggle-password"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background-color:#2c3e50; border-color:#2c3e50;">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts_extra %}
<script>
    document.getElementById('toggle-password').addEventListener('click', function () {
        const campo = document.getElementById('password');
        const icono = document.getElementById('icono-toggle-password');
        if (campo.type === 'password') {
            campo.type = 'text';
            icono.classList.remove('bi-eye');
            icono.classList.add('bi-eye-slash');
        } else {
            campo.type = 'password';
            icono.classList.remove('bi-eye-slash');
            icono.classList.add('bi-eye');
        }
    });
</script>
{% endblock %}
